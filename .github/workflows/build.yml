name: Build SHAHEEN-YS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-crossplane:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build Crossplane Binary
        run: |
          cd components/crossplane
          go build -v -o crossplane-bin ./cmd/crossplane

      - name: Upload Crossplane Binary
        uses: actions/upload-artifact@v4
        with:
          name: crossplane-binary
          path: components/crossplane/crossplane-bin

  verify-kubevirt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Verify KubeVirt Source
        run: |
          cd components/kubevirt
          go mod download
          go mod verify
          echo "KubeVirt source verified successfully."
